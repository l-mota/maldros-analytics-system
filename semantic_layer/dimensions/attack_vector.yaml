name: attack_vector
label: Attack Vector
description: >
  The category of fraud or abuse attack. This is the primary analytical segmentation
  dimension for all Financial Impact Analysis metrics. Every metric can be
  sliced by attack_vector to identify which type of threat is driving observed patterns.

type: categorical
grain: per-event / per-incident

values:
  - value: api_abuse
    label: API Abuse
    description: >
      Unauthorized or exploitative use of the API: token theft, API key sharing,
      proxy services, high-volume scraping, cost fraud (using the API at cost without
      authorization). Vector 1 and Vector 2 in FIA §1.1–1.2.
    severity_distribution: low:0.30 / medium:0.40 / high:0.20 / critical:0.10
    detection_lead_time_days: 1-7

  - value: safety_bypass
    label: Safety Bypass
    description: >
      Deliberate circumvention of model safety guardrails: jailbreaks, prompt
      injection, system prompt extraction, adversarial inputs designed to elicit
      policy-violating outputs. Escalates gradually and is detectable by SPRT.
      Vector 3 in FIA §1.3.
    severity_distribution: low:0.10 / medium:0.35 / high:0.40 / critical:0.15
    detection_lead_time_days: 3-30

  - value: platform_fraud
    label: Platform Fraud
    description: >
      Financial fraud conducted through or against the platform: fraudulent
      account creation, payment fraud, subscription abuse, referral fraud,
      credit-back schemes. Vector 4 in FIA §1.4.
    severity_distribution: low:0.15 / medium:0.30 / high:0.35 / critical:0.20
    detection_lead_time_days: 7-60

  - value: downstream_harm
    label: Downstream Harm
    description: >
      Harm caused to third parties by AI-generated content: misinformation,
      targeted harassment, generation of harmful content at scale, use of AI
      outputs for fraud against downstream victims. Hardest category to quantify.
      Vector 5 in FIA §1.5.
    severity_distribution: low:0.20 / medium:0.30 / high:0.35 / critical:0.15
    detection_lead_time_days: 14-90

  - value: data_poisoning
    label: Data Poisoning
    description: >
      Intentional manipulation of training data or model fine-tuning inputs to
      degrade model quality, inject backdoors, or exfiltrate model parameters.
      Requires privileged access; lower volume but very high severity.
      Vector 6 in FIA §1.6.
    severity_distribution: low:0.10 / medium:0.30 / high:0.40 / critical:0.20
    detection_lead_time_days: 30-180

applicable_metrics:
  - api_abuse_rate
  - fraud_loss_direct
  - safety_bypass_incidents
  - downstream_harm_exposure
  - compliance_cost_per_incident

tables_containing_this_dimension:
  - api_events (inferred via content_category → attack_vector mapping)
  - fraud_incidents (direct field)
  - financial_impact (direct field)
  - regulatory_events (direct field: related_attack_vector)

version: "1.0.0"
