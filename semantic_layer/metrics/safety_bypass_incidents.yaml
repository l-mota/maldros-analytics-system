name: safety_bypass_incidents
label: Safety Bypass Incidents
description: >
  Count of confirmed safety bypass incidents in the period. A "safety bypass
  incident" is an event recorded in fraud_incidents where attack_vector =
  'safety_bypass', regardless of severity. This metric tracks the volume of
  events where users or attackers deliberately circumvented the model's safety
  guardrails — jailbreaks, prompt injections, system prompt extraction, and
  adversarial inputs designed to elicit policy-violating outputs.

  This is a count metric (not a rate). Use api_abuse_rate for the rate view.
  Use fraud_loss_direct for the financial impact view.

type: count
grain: monthly (default); weekly (trend investigation mode)

computation_logic: |
  # Python pseudocode — not SQL

  safety_bypass_incidents = fraud_incidents[
      (fraud_incidents['attack_vector'] == 'safety_bypass')
      & (fraud_incidents['detected_date'] >= period_start)
      & (fraud_incidents['detected_date'] < period_end)
  ].shape[0]

  # Trend analysis (for SPRT): monthly rate per cluster
  monthly_rate_by_account = (
      fraud_incidents[fraud_incidents['attack_vector'] == 'safety_bypass']
      .assign(month=lambda df: pd.to_datetime(df['detected_date']).dt.to_period('M'))
      .groupby(['account_id', 'month'])
      .size()
      .reset_index(name='incident_count')
  )

applicable_filters:
  - severity (low/medium/high/critical)
  - detection_method (automated_threshold/automated_ml/human_review/external_report)
  - resolved (True/False)
  - account_tier
  - region
  - cluster_id (cluster_b shows escalation signal)

dimensions:
  - attack_vector  # fixed to 'safety_bypass' for this metric
  - account_tier
  - region
  - time_period

owner: analyst
team: fraud_abuse_analytics

policy_rationale: >
  Safety bypass incidents are tracked separately from general API abuse because:
  (1) they have distinct regulatory implications — EU AI Act GPAI provisions
  require incident reporting for safety bypass events above a materiality threshold;
  (2) the escalation pattern is detectably different (gradual escalation consistent
  with learning curves, not step-function spikes); (3) they require a different
  remediation path (model-level mitigations, not account-level rate limits).

  The SPRT monitoring protocol runs continuously on this metric — it is specifically
  designed to detect the rate change that characterizes professional jailbreak
  operators moving from testing to exploitation.

sprt_configuration:
  null_hypothesis_rate: 1.0   # baseline incidents/account/month
  alternative_rate: 3.0       # escalation level of concern
  alpha: 0.05                 # false positive rate
  beta: 0.10                  # false negative rate
  # SPRT detects escalation ~3-4 months before fixed threshold triggers

known_limitations:
  - only counts incidents in fraud_incidents table — undercounting is likely for
    sophisticated attacks that never trigger incident creation
  - the automated_threshold detection method has lower recall than automated_ml
    (more sophisticated attacks evade threshold rules)
  - count without normalization by total API calls is misleading when volume
    changes significantly; always report alongside api_abuse_rate for context
  - '"safety bypass" encompasses a wide range of severity — a simple jailbreak
    and a systematic model extraction attack are both counted; always segment by
    severity for decision-making'

judgment_mechanism: 1
  # Mechanism 1: count metric, fully computable from data.
  # SPRT configuration parameters (null/alternative hypothesis rates) require
  # initial judgment but are then validated by Statistician Agent quarterly.

version_history:
  - version: "1.0.0"
    date: "2026-06-08"
    change: "Initial definition — Phase 0"
    author: analyst
